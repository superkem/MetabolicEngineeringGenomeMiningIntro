<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Genome Mining – Animated Walkthrough</title>
<style>
:root{--bg:#eef3f2;--ink:#14302c;--mut:#587670;--card:#fff;--line:#d3e0dd;--acc:#0f9d8a;--acc2:#0b6e61;--dark:#0d2b27}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
header{background:var(--dark);color:#e8fffb;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
header p{margin:0;color:#9fd8cf;font-size:13.5px}
header .sp{flex:1}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;max-width:1320px;margin:0 auto;padding:16px}
nav{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;align-self:start;position:sticky;top:12px}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
nav button:hover{background:#e9f5f3}
nav button.on{background:var(--acc);color:#fff}
nav button .n{flex:none;min-width:26px;height:26px;padding:0 4px;border-radius:13px;background:#dcebe8;color:var(--acc2);font-weight:700;font-size:12.5px;display:grid;place-items:center}
nav button.on .n{background:#fff;color:var(--acc2)}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);padding:10px 10px 4px}
main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stagehead{display:flex;align-items:baseline;gap:12px;padding:12px 18px 0}
.stagehead h2{margin:0;font-size:19px}
.stagehead span{color:var(--mut);font-size:13.5px}
#stage{display:block;width:100%;height:auto;aspect-ratio:960/440}
.svgstage text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.svgstage text.mono,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.t{transition:transform 1.1s cubic-bezier(.45,0,.2,1),opacity .8s ease,fill .7s,stroke .7s;transform-origin:0 0}
.notrans .t{transition:none!important}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bub{animation:bub 3s ease-in-out infinite alternate}
@keyframes bub{from{transform:translateY(6px)}to{transform:translateY(-8px)}}
.shake{animation:shake .5s ease-in-out infinite alternate}
@keyframes shake{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.fl{animation:fl .9s ease-out}
@keyframes fl{0%{opacity:.7}100%{opacity:0}}
.pulse{animation:pulse 1.1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
.trace{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2.6s ease}
.cap{padding:6px 20px 14px;display:grid;gap:6px;min-height:150px}
.cap .meta{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:22px;height:8px;border-radius:5px;background:#d3e0dd;cursor:pointer;transition:.25s}
.dots i.on{background:var(--acc);width:34px}
.dots i.done{background:#8fd3c8}
.cap h3{margin:0;font-size:19px}
.cap .en{font-size:16px;margin:0}
.cap .vi{font-size:14.5px;margin:0;color:#3d6a63;background:#eaf6f3;border-left:4px solid var(--acc);padding:7px 11px;border-radius:0 8px 8px 0}
body.novi .vi{display:none}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding:10px 16px;background:#f8fbfa}
.ctrl button,.ctrl select{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;color:var(--ink)}
.ctrl button:hover{border-color:var(--acc)}
.ctrl button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;min-width:104px}
.ctrl .sp{flex:1}
.ctrl label{font-size:13.5px;color:var(--mut);display:flex;gap:6px;align-items:center}
#quiz{padding:18px 22px 26px}
#quiz h3{margin:0 0 4px}
.q{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0}
.q p{margin:0 0 8px;font-weight:600}
.q button{display:block;width:100%;text-align:left;margin:5px 0;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;font:inherit;cursor:pointer}
.q button:hover:not(:disabled){border-color:var(--acc);background:#f0faf8}
.q button.ok{background:#d3f9d8;border-color:#40c057}
.q button.bad{background:#ffe3e3;border-color:#fa5252}
.q .ex{display:none;font-size:14px;color:#3d6a63;margin-top:6px}
.q.done .ex{display:block}
#score{font-weight:700;color:var(--acc2)}
@media(max-width:860px){
 .app{grid-template-columns:1fr;padding:10px}
 nav{display:flex;overflow-x:auto;position:static;gap:4px}
 nav button{white-space:nowrap;width:auto}
 nav .grp{display:none}
 .cap h3{font-size:17px}.cap .en{font-size:15px}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>🧬 Genome Mining – from a colony to a gene cluster</h1>
    <p>Animated walkthrough: DNA extraction · sequencing · assembly · gene prediction · BGC detection · validation</p>
  </div>
  <div class="sp"></div>
  <label style="font-size:13.5px;color:#9fd8cf;display:flex;gap:6px;align-items:center"><input type="checkbox" id="viTog" checked> Tiếng Việt</label>
</header>
<div class="app">
  <nav id="nav"></nav>
  <main>
    <div class="card">
      <div class="stagehead"><h2 id="sTitle"></h2><span id="sSub"></span></div>
      <svg id="stage" class="svgstage" viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated diagram"></svg>
      <div id="quiz" style="display:none"></div>
      <div class="cap" id="cap">
        <div class="meta"><span id="stepNo"></span><div class="dots" id="dots"></div></div>
        <h3 id="cT"></h3>
        <p class="en" id="cEn"></p>
        <p class="vi" id="cVi"></p>
      </div>
      <div class="ctrl" id="ctrl">
        <button id="bPrev" title="Previous (←)">◀ Back</button>
        <button id="bPlay" class="pri" title="Play / pause (space)">▶ Play</button>
        <button id="bNext" title="Next (→)">Next ▶</button>
        <button id="bRe" title="Replay this step">↻ Replay step</button>
        <span class="sp"></span>
        <label>Speed
          <select id="spd"><option value="0.6">0.6×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
        </label>
      </div>
    </div>
  </main>
</div>

<script>
/* ================= helpers ================= */
const NS="http://www.w3.org/2000/svg";
const COL={A:'#2f9e44',T:'#e03131',G:'#f08c00',C:'#1971c2'};
function E(tag,a,p){const e=document.createElementNS(NS,tag);e.setAttribute('class','t'+(a&&a.class?' '+a.class:''));if(a)for(const k in a)if(k!=='class')e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function G(p){return E('g',null,p)}
function TX(p,x,y,s,a){const e=E('text',Object.assign({x,y},a||{}),p);e.textContent=s;return e}
function S(e,o){const s=e._s||(e._s={x:0,y:0,r:0,sx:1,sy:1});
  for(const k of ['x','y','r','sx','sy'])if(o[k]!==undefined)s[k]=o[k];
  if(o.s!==undefined){s.sx=s.sy=o.s}
  e.style.transform=`translate(${s.x}px,${s.y}px) rotate(${s.r}deg) scale(${s.sx},${s.sy})`;
  e.style.transitionDelay=(o.d||0)+'s';

  E('rect',{x:-w/2,y:-w/2,width:w,height:w,rx:6,fill:c,'fill-opacity':o.solid?1:.2,stroke:c,'stroke-width':1.5},g);

const GT={pks:'#e03131',sugar:'#f59f00',bio:'#1c7ed6',reg:'#37b24d',trans:'#7048e8',other:'#adb5bd'};

/* ================= scenes ================= */
const scenes=[];

/* ---------- 0 Overview ---------- */
scenes.push({title:'The big picture',sub:'Six stages from a Petri dish to a validated compound',go:null,build(svg,api){
  const N=[
   {a:'Material',b:'preparation',out:'gDNA',go:1,q:'Which strain? Which medium? How do we get clean DNA?'},

   {a:'Read',b:'assembly',out:'contigs (FASTA)',go:4,q:'How do we put millions of short pieces back in order?'},
   {a:'Gene',b:'prediction',out:'genes / proteins',go:6,q:'Where are the genes, and what do they probably do?'},

  return{steps:[
   {t:'From a colony on a plate to a molecule in a vial',en:'Genome mining reads an organism’s DNA to find the “recipes” – biosynthetic gene clusters (BGCs) – for natural products (NPs). The workflow has six stages. Follow them in order, or click any box to jump to its animation.',vi:'Khai thác bộ gen (genome mining) là đọc DNA của sinh vật để tìm các “công thức” – cụm gen sinh tổng hợp (BGC) – tạo ra sản phẩm tự nhiên. Quy trình gồm 6 giai đoạn; bấm vào từng ô để xem hoạt ảnh.'},
   {t:'Stage 1 – Material preparation',en:'We choose and grow the strain (the medium matters!), then purify high-quality genomic DNA. Everything downstream depends on this DNA being clean and intact.',vi:'Chọn và nuôi cấy chủng (môi trường rất quan trọng!), sau đó tinh sạch DNA hệ gen. Chất lượng DNA quyết định chất lượng mọi bước sau.'},
   {t:'Stage 2 – DNA sequencing',en:'Sequencers cannot read a whole genome in one go. They read short fragments: long and accurate one-at-a-time (Sanger) or millions in parallel (Illumina).',vi:'Máy giải trình tự không đọc cả hệ gen một lần mà đọc từng đoạn ngắn: Sanger (từng đoạn, chính xác) hoặc Illumina (hàng triệu đoạn song song).'},
   {t:'Stage 3 – Read assembly',en:'Software finds overlaps between reads and merges them into contigs, then scaffolds, then a draft genome. (For Streptosporangium B16437 the assembler was SPAdes.)',vi:'Phần mềm tìm các đoạn chồng lấp giữa các read rồi ghép thành contig, scaffold và cuối cùng là bộ gen nháp. (Với chủng B16437, phần mềm ghép là SPAdes.)'},
   {t:'Stage 4 – Gene prediction',en:'In the assembled sequence we look for open reading frames – start codon to stop codon – and annotate what each protein probably does by comparing it with databases.',vi:'Trong chuỗi đã ghép, ta tìm khung đọc mở (ORF) – từ codon khởi đầu đến codon kết thúc – rồi chú giải chức năng protein bằng cách so với cơ sở dữ liệu.'},

   {t:'Stage 6 – Genetic manipulation & validation',en:'Prediction is only a hypothesis. Disrupt a core gene of the cluster, then compare HPLC profiles of wild type and mutant: if one peak disappears, the cluster makes that compound.',vi:'Dự đoán mới chỉ là giả thuyết. Ta làm bất hoạt gen lõi của cụm rồi so sánh sắc ký HPLC của chủng gốc và chủng đột biến: mất một đỉnh nghĩa là cụm gen tạo ra hợp chất đó.'}],

   case 4:E('circle',{cx:58,cy:82,r:30,fill:'#fff',stroke:'#0d2b27','stroke-width':5},g);E('line',{x1:80,y1:104,x2:104,y2:128,stroke:'#0d2b27','stroke-width':8,'stroke-linecap':'round'},g);[[36,'#e03131'],[50,'#e03131'],[64,'#f59f00'],[78,'#1c7ed6']].forEach(([x,c])=>E('rect',{x:x-6,y:76,width:12,height:12,rx:3,fill:c},g));break;

}});

/* ---------- 1 Sample preparation ---------- */
scenes.push({title:'1 · Material preparation',sub:'Strain → culture → purified genomic DNA',build(svg){

  const A=G(svg);

  const r1=rng(7);for(let i=0;i<24;i++){const a=r1()*6.28,d=Math.sqrt(r1())*128;E('circle',{cx:480+d*Math.cos(a),cy:225+d*Math.sin(a),r:5+r1()*8,fill:['#6b7f8c','#c9a66b','#e8d9a8','#8c5a3c','#9aa9b5'][i%5]},petri)}
  E('circle',{cx:560,cy:190,r:19,fill:'#26364a'},petri);E('circle',{cx:560,cy:190,r:31,fill:'none',stroke:'#0f9d8a','stroke-width':3,'stroke-dasharray':'6 5',class:'spin'},petri);
  E('line',{x1:590,y1:178,x2:668,y2:150,stroke:'#0f9d8a','stroke-width':2},petri);
  TX(petri,672,148,'Streptosporangium B16437',{'font-size':15,'font-weight':700,fill:'#0b6e61'});TX(petri,672,168,'single colony = one pure strain',{'font-size':13,fill:'#587670'});
  TX(petri,480,425,'Isolation plate (actinomycete colonies)',{'text-anchor':'middle','font-size':13,fill:'#587670'});
  // plate with media
  const plate=G(A);E('rect',{x:200,y:44,width:550,height:350,rx:20,fill:'#eef3f2',stroke:'#b5c7c3','stroke-width':3},plate);
  const media=[['ISP2','#d9a441',.35],['NZSG','#8c5a3c',.9],['A1','#c85a8a',.15],['LB','#e9dfb0',.6],['Chitin','#9bb7c9',.25],['LWA','#4a6b52',.75]];
  const bars=[];const r2=rng(3);
  media.forEach((m,i)=>{const cx=300+(i%3)*150,cy=135+Math.floor(i/3)*140;E('circle',{cx,cy,r:58,fill:'#fff',stroke:'#9db2ad','stroke-width':3},plate);E('circle',{cx,cy,r:50,fill:m[1],opacity:.55},plate);
    for(let k=0;k<6;k++){const a=r2()*6.28,d=r2()*30;E('circle',{cx:cx+d*Math.cos(a),cy:cy+d*Math.sin(a),r:3+r2()*5,fill:m[1],stroke:'#26364a','stroke-width':1.2},plate)}
    TX(plate,cx,cy+78,m[0],{'text-anchor':'middle','font-size':13,'font-weight':700,fill:'#14302c'});
    const by=70+i*50;TX(plate,780,by+13,m[0],{'font-size':12,fill:'#587670'});const b=G(plate);E('rect',{x:0,y:0,width:100,height:16,rx:8,fill:'#0f9d8a'},b);S(b,{x:830,y:by,sx:0.001});b._v=m[2];bars.push(b);E('rect',{x:830,y:by,width:100,height:16,rx:8,fill:'none',stroke:'#b5c7c3'},plate)});
  TX(plate,830,56,'NP yield (relative)',{'font-size':13,'font-weight':700,fill:'#0b6e61'});
  // flask
  const fl=G(A);S(fl,{x:250,y:225,s:1.15});

 {q:'Why do Illumina nucleotides carry a reversible 3′ blocker?',o:['To make the DNA stable at room temperature','To ensure exactly one base is added per cycle','To make clusters brighter','To separate the strands'],a:1,ex:'The blocker allows one incorporation per cycle; after imaging it is removed so the next cycle can start.'},
 {q:'Which information do assembly programs mainly use to join reads?',o:['The GC content of the genome','Overlaps between the ends of reads','The size of the Petri dish','Antibiotic resistance'],a:1,ex:'Reads that share identical ends are neighbours in the genome and can be merged.'},
 {q:'What is a scaffold?',o:['A single read','Ordered and oriented contigs, possibly with N gaps','A plasmid vector','A protein domain'],a:1,ex:'Paired reads link contigs, giving a defined order and orientation; unknown stretches are written as N.'},
 {q:'An ORF is …',o:['Any sequence containing ATG','A stretch from a start codon to an in-frame stop codon','A promoter','A sequencing error'],a:1,ex:'An open reading frame runs from start to the first in-frame stop codon – a gene candidate.'},
 {q:'How does antiSMASH find a type II PKS cluster?',o:['By measuring the colour of colonies','By detecting core genes (KSα, KSβ…) with profile HMMs and adding neighbouring genes','By running HPLC','By counting reads'],a:1,ex:'Rule-based detection of signature enzymes, followed by extension to a region containing neighbouring genes.'},
 {q:'In the knock-out experiment, what result proves that the cluster makes the compound?',o:['The mutant grows faster','A peak present in the wild type is absent in the mutant HPLC trace','The plasmid is circular','The genome becomes shorter'],a:1,ex:'If disrupting a core gene removes one compound from the profile, the cluster is responsible for it.'}];
function buildQuiz(box){let sc=0,done=0;box.innerHTML='<h3>Check your understanding</h3><div>Score: <span id="score">0</span> / '+QZ.length+'</div>';
  QZ.forEach((q,qi)=>{const d=document.createElement('div');d.className='q';d.innerHTML='<p>'+(qi+1)+'. '+q.q+'</p>';
    q.o.forEach((t,k)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{if(d.classList.contains('done'))return;d.classList.add('done');[...d.querySelectorAll('button')].forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add('ok')});if(k===q.a)sc++;else b.classList.add('bad');done++;box.querySelector('#score').textContent=sc};d.appendChild(b)});
    const ex=document.createElement('div');ex.className='ex';ex.textContent='💡 '+q.ex;d.appendChild(ex);box.appendChild(d)})}
scenes.push({title:'Quiz',sub:'Eight quick questions',quiz:true});

/* ================= controller ================= */
const svg=document.getElementById('stage'),quiz=document.getElementById('quiz');
const nav=document.getElementById('nav');
const groups={0:'Overview',1:'Workflow',9:'Practice'};
scenes.forEach((s,i)=>{if(groups[i]){const h=document.createElement('div');h.className='grp';h.textContent=groups[i];nav.appendChild(h)}
  const b=document.createElement('button');b.innerHTML='<span class="n">'+(i===0?'★':(s.quiz?'?':s.title.match(/^\d+[ab]?/)[0]))+'</span><span>'+s.title.replace(/^\d+[ab]? · /,'')+'</span>';b.onclick=()=>load(i);nav.appendChild(b)});
let cur=null,sIdx=0,step=0,timer=null,playing=false;
const $=id=>document.getElementById(id);
function load(i,start){stop();sIdx=i;const sc=scenes[i];[...nav.querySelectorAll('button')].forEach((b,k)=>b.classList.toggle('on',k===i));
  $('sTitle').textContent=sc.title;$('sSub').textContent=sc.sub;try{history.replaceState(null,'','#'+i)}catch(e){}
  svg.innerHTML='';
  if(sc.quiz){svg.style.display='none';quiz.style.display='block';$('cap').style.display='none';$('ctrl').style.display='none';buildQuiz(quiz);cur=null;return}
  svg.style.display='block';quiz.style.display='none';$('cap').style.display='grid';$('ctrl').style.display='flex';
  cur=sc.build(svg,{go:n=>load(n)});
  if(cur.steps.length>1){}
  $('dots').innerHTML='';cur.steps.forEach((_,k)=>{const d=document.createElement('i');d.onclick=()=>{stop();goStep(k)};$('dots').appendChild(d)});
  start=start||0;step=start;
  if(start>0){svg.classList.add('notrans');cur.set(start-1);svg.getBoundingClientRect();requestAnimationFrame(()=>{svg.classList.remove('notrans');requestAnimationFrame(()=>goStep(start))})}
  else{svg.classList.add('notrans');cur.set(0);cur.set(-1>0?0:0);svg.getBoundingClientRect();svg.classList.remove('notrans');requestAnimationFrame(()=>requestAnimationFrame(()=>goStep(0)))}
}
function caption(){const st=cur.steps[step];$('cT').textContent=st.t;$('cEn').textContent=st.en;$('cVi').textContent=st.vi;$('stepNo').textContent='Step '+(step+1)+' / '+cur.steps.length;
  [...$('dots').children].forEach((d,k)=>{d.className=k===step?'on':(k<step?'done':'')});$('bPrev').disabled=step===0&&sIdx===0;}
function goStep(k){step=Math.max(0,Math.min(cur.steps.length-1,k));cur.set(step);caption()}
function dur(){const t=cur.steps[step];const base=(t.en.length*38+3500);const extra=(sIdx===2&&step===4)?9000:(sIdx===8&&step===0)?4000:(sIdx===8&&step===7)?3500:0;return(base+extra)/parseFloat($('spd').value)}
function play(){if(!cur)return;playing=true;$('bPlay').textContent='❚❚ Pause';if(step>=cur.steps.length-1)goStep(0);schedule()}
function schedule(){clearTimeout(timer);timer=setTimeout(()=>{if(step<cur.steps.length-1){goStep(step+1);schedule()}else stop()},dur())}
function stop(){playing=false;clearTimeout(timer);$('bPlay').textContent='▶ Play'}
function next(){stop();if(!cur)return;if(step<cur.steps.length-1)goStep(step+1);else if(sIdx<scenes.length-1)load(sIdx+1)}
function prev(){stop();if(!cur)return;if(step>0)goStep(step-1);else if(sIdx>0)load(sIdx-1)}
$('bPlay').onclick=()=>playing?stop():play();$('bNext').onclick=next;$('bPrev').onclick=prev;
$('bRe').onclick=()=>{const k=step;const was=playing;stop();load(sIdx,k);};
$('spd').onchange=()=>{if(playing)schedule()};
$('viTog').onchange=e=>document.body.classList.toggle('novi',!e.target.checked);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();else if(e.key===' '){e.preventDefault();playing?stop():play()}});
let h0=0;try{h0=parseInt(location.hash.slice(1))||0}catch(e){}
load(Math.min(scenes.length-1,Math.max(0,h0)));
</script>
</body>
